[package]
name = "hub-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "High-performance reverse proxy for GitHub and Hugging Face resources"
license = "MIT"
repository = "https://github.com/cololi/hub-proxy-rs"

[lib]
name = "hub_proxy"
path = "src/lib.rs"

[[bin]]
name = "hub-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "tokio", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2"] }
http = "1"
bytes = "1"
futures-util = "0.3"
regex = "1"
once_cell = "1"
url = "2"
humantime = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
